name: Deploy tsam.co.jp / blog.tsam.co.jp to Firebase Hosting

# 【未検証】このワークフローはまだ一度も走らせていない。
#   ・Firebase プロジェクト my-retro-bbs のサイト tsam-co-jp（公式。www/）と tsam-blog（ブログ。blog/）は作成済み（2026-11-26、Dots）
#   ・Google への名乗り方は、長く生きる鍵（firebase login:ci のトークン）を置かない形にした（Dots の指摘 2026-11-26）。
#     GitHub がその場で出す短い証明を Google が確かめて、デプロイ用のサービスアカウントとして動く（Workload Identity Federation）。
#     Google 側の準備と、このリポジトリの Variables（GCP_WIF_PROVIDER・GCP_DEPLOY_SA）がまだ。手順は docs/deploy.md
# main へ push したときだけ走る。作業ブランチでは走らない。公式とブログは一緒に出す（意匠の部品を共有しているため）。
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'blog/**'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: tsam-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Google に見せる短い証明を、GitHub に出してもらうため

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            blog/package-lock.json
      - name: Build www
        working-directory: www
        run: |
          npm ci
          npm run build
      # ブログは www/src の部品（輪の o・ロゴ・色と字）を読むので、www の依存も入っている必要がある（上で入る）
      - name: Build blog
        working-directory: blog
        run: |
          npm ci
          npm run build
      - name: Google に名乗る（鍵は置かない）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      # 出す先は tsam の二つのサイトだけ（同じプロジェクトにある off-notes のサイトには触れない）
      - name: Deploy
        run: npx firebase-tools deploy --only hosting:tsam-co-jp,hosting:tsam-blog --project my-retro-bbs

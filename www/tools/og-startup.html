<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@300;400;500&display=swap">
<style>
@font-face { font-family: Jost; src: url(../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #f0f0ee; color: #1c1c1e; font-family: 'IBM Plex Sans JP', sans-serif; position: relative; }
.logo { position: absolute; left: 64px; top: 54px; height: 24px; }
.site { position: absolute; right: 64px; top: 56px; font: 500 18px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; }
.word { position: absolute; left: 56px; top: 104px; font-family: Jost, sans-serif; font-weight: 300; font-size: 178px; line-height: 1; letter-spacing: -.022em; white-space: nowrap; }
.ring { display: inline-block; position: relative; width: .478em; height: .478em; margin: 0 .033em 0 .039em; border: .051em solid #d98577; border-radius: 50%; vertical-align: -.009em; }
.ring i { position: absolute; top: 50%; left: 50%; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border: 1.5px solid rgb(28 28 30 / .14); border-radius: 50%; }
.ring i:first-child { border-color: #d98577; }
.bar { position: absolute; left: 64px; right: 64px; top: 318px; padding-top: 16px; border-top: 1.5px solid #1c1c1e; display: flex; justify-content: space-between; align-items: center; font: 500 19px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
.bar span { margin-left: .9em; font-family: 'IBM Plex Sans JP', sans-serif; font-weight: 400; letter-spacing: .12em; color: #63636a; }
.lamps { display: flex; gap: 8px; }
.lamps i { width: 13px; height: 13px; border: 1.5px solid #1c1c1e; border-radius: 50%; }
.lamps i.on { background: #d98577; border-color: #d98577; }
.title { position: absolute; left: 64px; right: 64px; top: 372px; bottom: 50px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
h1 { font-weight: 400; font-size: 60px; line-height: 1.34; letter-spacing: .02em; word-break: auto-phrase; text-wrap: balance; }
p.sub { font-size: 30px; line-height: 1.5; letter-spacing: .04em; color: #63636a; word-break: auto-phrase; }
</style></head>
<body>
<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="1.3 10.25 197.02 41.98" fill="currentColor">__LOGO__</svg>
<p class="site">tsam.co.jp/startup</p>
<p class="word" id="word"></p>
<div class="bar"><p id="tag"></p><div class="lamps" id="lamps"></div></div>
<div class="title"><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
<script>
// draw({ word: 'M|del', tag: 'Round 05', ja: 'ビジネスモデル', lamps: 5, a: '題の頭', b: '題の続き' })
window.draw = (c) => {
  const [x, y] = c.word.split('|');
  const rings = c.hero ? [0.94, 1.42, 2.5, 4.05, 6.3] : [0.94];
  document.getElementById('word').innerHTML = `${x}<span class="ring">${rings.map((d) => `<i style="--d:${d}em"></i>`).join('')}</span>${y}`;
  document.getElementById('tag').innerHTML = `${c.tag}<span></span>`;
  document.querySelector('#tag span').textContent = c.ja;
  document.getElementById('lamps').innerHTML = c.lamps ? Array.from({ length: 8 }, (_, i) => `<i class="${i < c.lamps ? 'on' : ''}"></i>`).join('') : '';
  const h1 = document.getElementById('h1');
  const sub = document.getElementById('sub');
  h1.textContent = c.a;
  sub.textContent = c.b || '';
  sub.style.display = c.b ? '' : 'none';
  // 箱（高さ 208px）に収まるまで、題の字を小さくする
  const box = document.querySelector('.title');
  let size = 60;
  h1.style.fontSize = size + 'px';
  while (size > 34 && (h1.offsetHeight + (c.b ? sub.offsetHeight + 14 : 0) > box.clientHeight || h1.scrollWidth > box.clientWidth)) {
    size -= 2;
    h1.style.fontSize = size + 'px';
    sub.style.fontSize = Math.max(24, Math.round(size / 2)) + 'px';
  }
};
</script>
</body></html>
